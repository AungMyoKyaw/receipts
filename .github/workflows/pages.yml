name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Check, test, and build website
        working-directory: website
        env:
          GITHUB_PAGES: "true"
        run: |
          bun run check
          bun run test
          bun run build
      - name: Verify Pages output
        run: |
          test -f website/build/index.html
          test -f website/build/.nojekyll
          grep -q 'href="./_app/' website/build/index.html
          grep -q 'src="./images/' website/build/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
